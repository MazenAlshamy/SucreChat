services:
  - type: web
    name: securechat
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      - key: WEBRTC_FALLBACK
        value: "true"
      - key: DATABASE_URL
        value: sqlite:///./securechat.db
      - key: FRONTEND_DIST_DIR
        value: /app/frontend/dist
      - key: CORS_ORIGINS
        value: ""
